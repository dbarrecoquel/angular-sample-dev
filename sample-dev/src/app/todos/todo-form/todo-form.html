<section class="todo-form-page">
  <a routerLink="/todos" class="back-link">&larr; Retour a la liste</a>

  <h1>{{ isEditMode() ? 'Modifier la tache' : 'Nouvelle tache' }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <div class="field">
      <label for="title">Titre *</label>
      <input
        id="title"
        type="text"
        formControlName="title"
        placeholder="Ex : Preparer la reunion client"
      />
      @if (form.controls.title.invalid && form.controls.title.touched) {
        <span class="error">Le titre doit contenir au moins 2 caracteres.</span>
      }
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea
        id="description"
        formControlName="description"
        rows="4"
        placeholder="Details optionnels..."
      ></textarea>
    </div>

    <div class="form__actions">
      <a routerLink="/todos" class="btn btn--secondary">Annuler</a>
      <button type="submit" class="btn btn--primary">
        {{ isEditMode() ? 'Enregistrer' : 'Creer' }}
      </button>
    </div>
  </form>
</section>
